<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Violet Ultimate Randomiser</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Pokémon Violet Ultimate Randomiser</h1>
    </header>

    <main>
        <!-- Activity Builder Controls -->
        <section class="controls">
                        <div class="control-group">
                <label for="game-version">Region:</label>
                <select id="game-version">
                    <option value="Base">Paldea (Base Game)</option>
                    <option value="Teal Mask">Kitakami (DLC 1)</option>
                    <option value="Indigo Disk">Blueberry Academy (DLC 2)</option>
                </select>
            </div>

            <div class="control-group">
                <label for="activity-select">Activity:</label>
                <select id="activity-select">
                    <!-- Shiny Hunting Variations -->
                    <option value="Shiny Hunt (Mass Outbreak)">Shiny Hunt (Mass Outbreak)</option>
                    <option value="Shiny Hunt (Isolated Encounter)">Shiny Hunt (Isolated Encounter)</option>
                    <option value="Shiny Hunt (Masuda Method Hatching)">Masuda Egg Hatching</option>
                    
                    <!-- Battle Challenges -->
                    <option value="Tera Raid Battles (5-Star)">5-Star Tera Raids</option>
                    <option value="Tera Raid Battles (6-Star)">6-Star Tera Raids</option>
                    <option value="Tera Raid Battles (7-Star Event)">7-Star Event Tera Raids</option>
                    <option value="Academy Ace Tournament Run">Academy Ace Tournament Run</option>
                    <option value="BBQ Elite Four Rematch">BBQ Elite Four Rematch</option>
                    
                    <!-- Exploration & Grinding -->
                    <option value="BBQ Quests (Solo)">BBQ Quests (Solo)</option>
                    <option value="BBQ Quests (Union Circle Group)">BBQ Quests (Group)</option>
                    <option value="Synchro Machine Exploration">Synchro Exploration</option>
                    <option value="Ogre Oustin' Minigame">Ogre Oustin' Minigame</option>
                    <option value="Item Printer Spins">Item Printer Spins</option>
                    <option value="Gimmighoul Coin Hunting">Gimmighoul Coin Hunting</option>
                </select>
            </div>


            <div class="control-group">
                <label for="amount-input">Amount:</label>
                <input type="number" id="amount-input" value="25" min="1">
            </div>
            
            <button id="add-btn">Add custom task</button>
        </section>

        <!-- Current Available Pool -->
        <section class="pool-section">
            <div class="pool-header">
                <h3>Options Pool (<span id="pool-count">0</span> remaining)</h3>
                <div class="header-buttons">
                    <button id="reset-database-btn" class="alt-btn">Load Defaults</button>
                    <button id="clear-btn" class="alt-btn text-danger">Wipe All</button>
                </div>
            </div>
            <ul id="options-pool"></ul>
        </section>

        <!-- Randomiser Output Screen -->
        <section class="action-section">
            <button id="roll-btn">Randomise Next Task!</button>
            <div id="result-display" class="idle">Click Roll to Start!</div>
        </section>

        <!-- Completed Tasks Tracking Checklist -->
        <section class="completed-section">
            <h3>✅ Completed Tasks</h3>
            <ul id="completed-pool"></ul>
            <button id="clear-completed-btn" class="alt-btn">Clear History</button>
        </section>
    </main>

    <!-- Script at the very bottom ensures all elements exist before running -->
    <script src="script.js"></script>
</body>
</html>
